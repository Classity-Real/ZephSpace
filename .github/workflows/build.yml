name: Build ZephSpace Kernel

on:
  push:
    branches: [ xun-t-oss ]
  pull_request:
    branches: [ xun-t-oss ]
  workflow_dispatch:

env:
  KERNEL_DIR: .
  ARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

jobs:
  build:
    runs-on: namespace-profile-main
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            perl \
            python3 \
            git \
            ccache \
            curl \
            wget \
            xz-utils \
            tar \
            gzip \
            lz4 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            clang \
            lld \
            llvm

      - name: Get kernel defconfig
        run: |
          # GKI production config (android13-5.15 KMI) - same branch YASK-style
          # custom GKI kernels build on; devices with this frozen KMI run
          # Android 13 through 16 userland OTA'd on top.
          make ARCH=arm64 gki_defconfig

      - name: Enable integrated components
        run: |
          # DroidSpaces fragment: IPC/namespace/netfilter/tmpfs ACLs plus
          # the integrated KSU-Next/SUSFS/FUSE component configs.
          cat arch/arm64/configs/droidspace.config >> .config
          # Weak stubs for QCOM vendor IOMMU symbols missing in this tree
          echo 'CONFIG_ANDROID_STUBS=y' >> .config
          # Resolve all dependencies non-interactively
          yes '' | make ARCH=arm64 olddefconfig >/dev/null
          grep -E 'CONFIG_(FUSE_FS|KSU_NEXT|SUSFS|ANDROID_VENDOR_HOOKS|TRACEPOINTS|ANDROID_STUBS)=' .config

      - name: Build kernel (Image.gz + Image.lz4)
        run: |
          # Note: pipeline exit code is the last command (tee), so also
          # check the make exit code explicitly via PIPESTATUS.
          # KCFLAGS keeps the implicit-function-declaration net off while
          # vendor hooks are real tracepoints under gki_defconfig.
          make ARCH=arm64 LLVM=1 CC=clang LD=ld.lld \
            KCFLAGS="-Wno-implicit-function-declaration" \
            -j$(nproc) Image.gz Image.lz4 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify kernel image
        run: |
          for img in Image.gz Image.lz4; do
            if [ -f arch/arm64/boot/$img ]; then
              echo "✓ $img built successfully"
              ls -lh arch/arm64/boot/$img
            else
              echo "✗ $img not found"
              exit 1
            fi
          done

      - name: Upload kernel image artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zephspace-kernel-images
          path: |
            arch/arm64/boot/Image.gz
            arch/arm64/boot/Image.lz4
          retention-days: 7

      - name: Build AnyKernel3 flashable zip
        if: success()
        run: |
          mkdir -p anykernel/kernel
          cp arch/arm64/boot/Image.gz anykernel/kernel/
          cd anykernel
          zip -r9 ../zephspace-kernel.zip . -x '*.git*'
          cd ..
          ls -lh zephspace-kernel.zip

      - name: Upload AnyKernel3 zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephspace-anykernel-zip
          path: zephspace-kernel.zip
          retention-days: 7
