name: Build ZephSpace Kernel

on:
  push:
    branches: [ xun-t-oss ]
  pull_request:
    branches: [ xun-t-oss ]
  workflow_dispatch:

env:
  KERNEL_DIR: .
  ARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

jobs:
  build:
    runs-on: namespace-profile-main
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            perl \
            python3 \
            git \
            ccache \
            curl \
            wget \
            xz-utils \
            tar \
            gzip \
            lz4 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            clang \
            lld \
            llvm

      - name: Get kernel defconfig
        run: |
          make ARCH=arm64 defconfig

      - name: Enable integrated components
        run: |
          # Append component config options directly (scripts/config would
          # trigger interactive syncconfig on the next make invocation)
          echo 'CONFIG_ANDROID=y' >> .config
          echo 'CONFIG_ANDROID_VENDOR_OEM_DATA=y' >> .config
          echo 'CONFIG_FUSE_FS=y' >> .config
          echo 'CONFIG_KSU_NEXT=y' >> .config
          echo 'CONFIG_SUSFS=y' >> .config
          # Weak stubs for Android/QCOM vendor symbols missing in this tree
          echo 'CONFIG_ANDROID_STUBS=y' >> .config
          # Disable Qualcomm board-specific drivers that depend on Android
          # PMIC infrastructure not present in this standalone tree
          echo 'CONFIG_POWER_RESET_MSM=n' >> .config
          # Disable Qualcomm interconnect drivers that depend on Android
          # trace infrastructure not present in this standalone tree
          echo 'CONFIG_INTERCONNECT_QCOM=n' >> .config
          # Resolve all dependencies non-interactively
          yes '' | make ARCH=arm64 olddefconfig >/dev/null
          grep -E 'CONFIG_(FUSE_FS|KSU_NEXT|SUSFS|ANDROID|ANDROID_STUBS)=' .config

      - name: Build kernel (Image.gz)
        run: |
          # Note: pipeline exit code is the last command (tee), so also
          # check the make exit code explicitly via PIPESTATUS.
          # -Wno-implicit-function-declaration allows compilation of Android
          # vendor hook call sites whose trace infrastructure isn't present
          # in this standalone tree.
          make ARCH=arm64 LLVM=1 CC=clang LD=ld.lld \
            KCFLAGS="-Wno-implicit-function-declaration" \
            -j$(nproc) Image.gz 2>&1 | tee build.log
          test "${PIPESTATUS[0]}" -eq 0

      - name: Verify kernel image
        run: |
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "✓ Kernel image built successfully"
            ls -lh arch/arm64/boot/Image.gz
            file arch/arm64/boot/Image.gz
          else
            echo "✗ Kernel image not found"
            exit 1
          fi

      - name: Upload kernel image artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephspace-kernel-image
          path: arch/arm64/boot/Image.gz
          retention-days: 7

      - name: Build AnyKernel3 flashable zip
        if: success()
        run: |
          mkdir -p anykernel/kernel
          cp arch/arm64/boot/Image.gz anykernel/kernel/
          cd anykernel
          zip -r9 ../zephspace-kernel.zip . -x '*.git*'
          cd ..
          ls -lh zephspace-kernel.zip

      - name: Upload AnyKernel3 zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephspace-anykernel-zip
          path: zephspace-kernel.zip
          retention-days: 7
