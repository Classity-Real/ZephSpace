name: Build ZephSpace Kernel

on:
  push:
    branches: [ xun-t-oss ]
  pull_request:
    branches: [ xun-t-oss ]
  workflow_dispatch:

env:
  KERNEL_DIR: .
  ARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libncurses-dev \
            perl \
            python3 \
            git \
            ccache \
            curl \
            wget \
            xz-utils \
            tar \
            gzip \
            lz4 \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            clang \
            lld \
            llvm

      - name: Get kernel defconfig
        run: |
          make ARCH=arm64 defconfig

      - name: Enable integrated components
        run: |
          # Append component config options directly (scripts/config would
          # trigger interactive syncconfig on the next make invocation)
          cat >> .config <<'EOF'

CONFIG_ANDROID=y
CONFIG_ANDROID_VENDOR_OEM_DATA=y
CONFIG_FUSE_FS=y
CONFIG_KSU_NEXT=y
CONFIG_SUSFS=y
EOF
          # Resolve all dependencies non-interactively
          yes '' | make ARCH=arm64 olddefconfig >/dev/null
          grep -E 'CONFIG_(FUSE_FS|KSU_NEXT|SUSFS|ANDROID)=' .config

      - name: Build kernel (Image.gz)
        run: |
          # Detect which clang warning-suppression flags are supported
          # (kernel 5.15 meets newer clang; older clang won't know them)
          KCFLAGS=""
          for flag in -Wno-default-const-init-field-unsafe \
                      -Wno-uninitialized-const-pointer \
                      -Wno-default-const-init-var-unsafe; do
            if echo 'int main(){return 0;}' | clang -x c - -fsyntax-only $flag 2>/dev/null; then
              KCFLAGS="$KCFLAGS $flag"
            fi
          done

          make ARCH=arm64 LLVM=1 CC=clang LD=ld.lld \
            KCFLAGS="$KCFLAGS" \
            -j$(nproc) Image.gz 2>&1 | tee build.log

      - name: Verify kernel image
        run: |
          if [ -f arch/arm64/boot/Image.gz ]; then
            echo "✓ Kernel image built successfully"
            ls -lh arch/arm64/boot/Image.gz
            file arch/arm64/boot/Image.gz
          else
            echo "✗ Kernel image not found"
            exit 1
          fi

      - name: Upload kernel image artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephspace-kernel-image
          path: arch/arm64/boot/Image.gz
          retention-days: 7

      - name: Build AnyKernel3 flashable zip
        if: success()
        run: |
          mkdir -p anykernel/kernel
          cp arch/arm64/boot/Image.gz anykernel/kernel/
          cd anykernel
          zip -r9 ../zephspace-kernel.zip . -x '*.git*'
          cd ..
          ls -lh zephspace-kernel.zip

      - name: Upload AnyKernel3 zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephspace-anykernel-zip
          path: zephspace-kernel.zip
          retention-days: 7
